
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LUCKYCLUB</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />

  <script>
    window.LANDING = {
      BRAND: "LUCKY CLUB",
      PIXEL_ID: "1667413624999920"
    };
  </script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}

    body{
      font-family:Arial,Helvetica,sans-serif;
      color:#fff;
      background:#000;
      -webkit-font-smoothing:antialiased
    }

    .background-image{
      background:#000 url("imagenes/fondo.avif") center/cover no-repeat;
      width:100%;
      min-height:100vh;
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative
    }

    .overlay{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.7)
    }

    .content{
      position:relative;
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:18px 14px;
      width:min(92vw,520px)
    }

    .logo{
      width:250px;
      height:250px;
      object-fit:contain;
      display:block
    }

    .title{
      margin:10px 0 15px;
      font-size:22px;
      font-weight:800;
      line-height:1.15;
      text-wrap:balance
    }

    .subtitle{
      font-size:19px;
      margin-top:40px;
      line-height:1.25
    }

    .description{
      color:gold;
      font-size:14px;
      font-weight:800;
      margin:35px 0 50px
    }

    .whatsapp-button{
      position:relative;
      overflow:hidden;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      background:linear-gradient(145deg,#155c3d,#0e2d1e);
      color:#fff;
      font-size:28px;
      font-weight:900;
      padding:20px;
      border:3px solid #fff;
      border-radius:10px;
      text-decoration:none;
      margin-top:25px;
      min-width:250px;
      box-shadow:0 0 30px 8px rgba(255,215,0,.70),0 10px 22px rgba(0,0,0,.45);
      animation:heartbeat 2s infinite ease-in-out;
      transition:transform .16s ease;
      -webkit-tap-highlight-color:transparent;
      user-select:none
    }

    .whatsapp-button:active{
      transform:scale(.97)
    }

    .whatsapp-button::before{
      content:"";
      position:absolute;
      inset:0;
      width:50%;
      background:linear-gradient(120deg,transparent,rgba(255,255,255,.55),transparent);
      transform:translateX(-150%) skewX(-25deg);
      animation:shineX 3.8s infinite;
      pointer-events:none
    }

    .whatsapp-icon{
      width:30px;
      height:30px;
      display:block
    }

    @keyframes shineX{
      from{transform:translateX(-150%) skewX(-25deg)}
      to{transform:translateX(300%) skewX(-25deg)}
    }

    @keyframes heartbeat{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.03)}
    }
  </style>

  <link rel="stylesheet" href="./styles.css" media="print"
        onload="this.media='all'">

  <noscript>
    <link rel="stylesheet" href="./styles.css">
  </noscript>

  <link rel="preconnect" href="https://connect.facebook.net" crossorigin />
  <link rel="dns-prefetch" href="//connect.facebook.net" />
  <link rel="preload" as="image" href="imagenes/fondo.avif"
        type="image/avif" fetchpriority="high" />

  <!-- Meta Pixel -->
  <script>
    !function(f,b,e,v,n,t,s){
      if(f.fbq)return;
      n=f.fbq=function(){
        n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)
      };
      if(!f._fbq)f._fbq=n;
      n.push=n;
      n.loaded=!0;
      n.version='2.0';
      n.queue=[];
      t=b.createElement(e);
      t.async=!0;
      t.src=v;
      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)
    }(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  </script>

  <!-- Inicialización Pixel -->
  <script>
    (function(){
      const PIXEL_ID = window.LANDING.PIXEL_ID;

      fbq("init", PIXEL_ID);
      fbq("track", "PageView");

      const qs = new URLSearchParams(location.search);

      (function(){
        const campaign = qs.get("utm_campaign");
        if(campaign){
          try{
            localStorage.setItem("utm_campaign", campaign);
          }catch{}
        }
      })();

      function getUTMCampaign(){
        return qs.get("utm_campaign") ||
          (function(){
            try{
              return localStorage.getItem("utm_campaign");
            }catch{
              return null;
            }
          })() || "ORG";
      }

      function getDeviceType(){
        const ua = navigator.userAgent;
        if(/ipad|tablet|playbook|silk/i.test(ua)) return "tablet";
        if(/mobile/i.test(ua)) return "mobile";
        return "desktop";
      }

      window.__META = {
        BRAND_NAME: window.LANDING.BRAND,
        getUTMCampaign,
        getDeviceType
      };
    })();
  </script>

  <noscript>
    <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1667413624999920&ev=PageView&noscript=1" />
  </noscript>
</head>

<body>
  <div class="container background-image">
    <div class="overlay"></div>

    <div class="content">
      <img src="imagenes/logo.png"
           class="logo"
           width="250"
           height="250"
           alt="LUCKY CLUB"
           decoding="async"
           fetchpriority="high" />

      <p class="title">
        Envianos un WhatsApp<br />
        para crear tu cuenta
      </p>

      <a class="whatsapp-button"
         id="whatsappButton"
         href="#"
         aria-label="Contactar por WhatsApp">

        <span>¡Contactá ya!</span>

        <img src="imagenes/whatsapp.png"
             alt="WhatsApp"
             class="whatsapp-icon"
             width="30"
             height="30"
             decoding="async" />
      </a>

      <p class="subtitle">
        Sin Límite de retiro<br />
        Sin Cronogramas<br />
        Ganás y cobrás a cualquier hora
      </p>

      <p class="description">
        -RED OFICIAL: LUCKY CLUB-
      </p>
    </div>
  </div>

  <script>
    // NÚMEROS DE WHATSAPP
    const FIXED_PHONES = [
      "5493513774137",
      "5493513449711"
    ];

    function normalizePhoneDigits(raw){
      return String(raw || "").replace(/\D+/g, "").trim();
    }

    // Selección aleatoria de número
    function pickFixed(){
      const pool = FIXED_PHONES
        .map(normalizePhoneDigits)
        .filter(n => /^\d{8,17}$/.test(n));

      if(!pool.length) return null;

      return pool[Math.floor(Math.random() * pool.length)];
    }

    // MENSAJES ALEATORIOS: SIN CÓDIGO PROMOCIONAL
    function buildMensaje(){
      const variantes = [
        "Hola! Vi este anuncio, me pasás info?",
        "Hola! Vi el anuncio, podrías darme más info?",
        "Buenas! Me contás un poco más del anuncio?",
        "Hola! Quisiera saber más sobre lo que ofrecen.",
        "Buenas! Me das más detalles por favor?",
        "Hola! Estoy interesado, me contás cómo funciona?",
        "Hola! Vi tu publicación, podrías ampliarme la info?",
        "Holaaa! Me llamó la atención el anuncio, me contás más?",
        "Hola! Vi tu publicidad, cómo es para registrarse?",
        "Buenas! Me das información sobre cómo empezar?",
        "Hola! Cómo hago para empezar?"
      ];

      return variantes[Math.floor(Math.random() * variantes.length)];
    }

    let __picked = null;
    let __waInFlight = false;

    function contactarWhatsApp({source = "main_button"} = {}){
      if(__waInFlight) return;

      const picked = __picked || pickFixed();
      if(!picked) return;

      const cleanPhone = normalizePhoneDigits(picked);

      if(!/^\d{8,17}$/.test(cleanPhone)) return;

      __waInFlight = true;

      const mensaje = buildMensaje();
      const waUrl =
        `https://wa.me/${cleanPhone}?text=${encodeURIComponent(mensaje)}`;

      // Medimos el clic; no significa que se haya enviado un mensaje.
      try{
        if(typeof window.fbq === "function"){
          const M = window.__META || {};

          fbq("trackCustom", "WhatsAppClick", {
            content_name: "Botón WhatsApp",
            source: source,
            method: "Click",
            utm_campaign: M.getUTMCampaign
              ? M.getUTMCampaign()
              : "ORG",
            device_type: M.getDeviceType
              ? M.getDeviceType()
              : undefined,
            brand: M.BRAND_NAME || window.LANDING.BRAND
          });
        }
      }catch(error){
        console.error("Error registrando el clic:", error);
      }

      // Redirigir a WhatsApp
      window.location.href = waUrl;
    }

    document.addEventListener("DOMContentLoaded", () => {
      __picked = pickFixed();

      const btn = document.getElementById("whatsappButton");

      if(btn){
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          contactarWhatsApp({source: "main_button"});
        });
      }
    });
  </script>
</body>
</html>
